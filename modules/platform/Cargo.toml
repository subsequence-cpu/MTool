[package]
name = "mtool-platform"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mtool-core.workspace = true
arboard = "3.6"
image.workspace = true
getrandom.workspace = true
zeroize.workspace = true
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSPasteboard", "NSWorkspace", "NSRunningApplication"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Threading", "Win32_System_LibraryLoader"] }
