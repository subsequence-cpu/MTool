name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install fixed Rust toolchain
        run: rustup show active-toolchain
      - name: Select Windows Perl
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $perl = (Get-Command perl -ErrorAction Stop).Source
          "OPENSSL_SRC_PERL=$perl" >> $env:GITHUB_ENV
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: cargo fmt --all --check
      - run: pnpm bindings
      - name: Verify generated contracts
        run: git diff --exit-code -- ui/bindings
      - run: pnpm build
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build -p mtool-desktop --locked
